name: Build Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: Projeto SQEducaPlay
        run: flutter pub get

      - name: Analyze
        working-directory: Projeto SQEducaPlay
        run: flutter analyze

      - name: Test
        working-directory: Projeto SQEducaPlay
        run: flutter test

      - name: Build Web
        working-directory: Projeto SQEducaPlay
        run: flutter build web --release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Projeto SQEducaPlay/build/web
